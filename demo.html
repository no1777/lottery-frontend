<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes" />
    <title>🎰 六合彩 · 开奖系统</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: linear-gradient(145deg, #0b1a2e 0%, #1a2f44 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            padding: 1rem;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .container {
            max-width: 1100px;
            width: 100%;
        }
        .card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 2rem;
            padding: 1.5rem 1.2rem 1.8rem;
            box-shadow: 0 25px 50px -8px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 215, 100, 0.15);
            margin-bottom: 1rem;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        .header h1 {
            font-size: 1.6rem;
            font-weight: 500;
            color: #f6e9b0;
            text-shadow: 0 2px 8px rgba(255, 200, 50, 0.3);
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .header h1 span {
            background: rgba(255, 215, 0, 0.15);
            padding: 0.05rem 0.8rem;
            border-radius: 60px;
            font-size: 1rem;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }
        .period-badge {
            background: rgba(255, 215, 0, 0.12);
            padding: 0.2rem 1rem;
            border-radius: 60px;
            color: #ffd700;
            font-size: 1rem;
            font-weight: 600;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }
        .period-badge span {
            font-size: 1.3rem;
            color: #fff;
        }
        .lottery-panel {
            background: rgba(10, 20, 30, 0.5);
            border-radius: 1.5rem;
            padding: 1rem 0.8rem;
            border: 1px solid rgba(255, 215, 0, 0.08);
        }
        .number-area {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 0.8rem 1.5rem;
            min-height: 90px;
        }
        .main-numbers {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.5rem;
        }
        .ball-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.1rem;
        }
        .ball {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: 700;
            color: #fff;
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.4), 0 6px 16px rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.15);
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
            flex-shrink: 0;
            transition: all 0.2s;
        }
        .ball.special {
            border-color: #ffd700;
            box-shadow: 0 4px 0 #b8860b, 0 0 24px rgba(255, 215, 0, 0.15);
        }
        .ball.color-red {
            background: radial-gradient(circle at 30% 28%, #ff6b6b, #c0392b);
        }
        .ball.color-blue {
            background: radial-gradient(circle at 30% 28%, #6b9fff, #1a4c8b);
        }
        .ball.color-green {
            background: radial-gradient(circle at 30% 28%, #6bda6b, #1a7a2a);
        }
        .ball.waiting {
            background: rgba(40, 50, 60, 0.6);
            color: #8a9aa8;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.5);
            border: 2px dashed rgba(255, 200, 100, 0.15);
            box-shadow: none;
            backdrop-filter: blur(4px);
        }
        .zodiac-label {
            font-size: 0.6rem;
            font-weight: 600;
            color: #f0e6c0;
            min-height: 1rem;
            line-height: 1rem;
            background: rgba(0, 0, 0, 0.3);
            padding: 0 0.3rem;
            border-radius: 20px;
            border: 1px solid rgba(255, 215, 0, 0.08);
        }
        .zodiac-label.empty {
            color: #667a88;
        }
        .zodiac-label.special {
            color: #ffd700;
            font-weight: 600;
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.5rem;
            padding: 0.3rem 0.8rem;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 40px;
            border: 1px solid rgba(255, 215, 0, 0.06);
        }
        .status-bar .draw-time {
            color: #b7b9b0;
            font-size: 0.75rem;
        }
        .status-bar .draw-time span {
            color: #ffd700;
            font-weight: 600;
        }
        .status-bar .countdown {
            color: #f5c542;
            font-size: 0.9rem;
            font-weight: 600;
        }
        .status-bar .countdown .time {
            color: #ffd700;
            font-size: 1.1rem;
        }
        .status-text {
            text-align: center;
            color: #f5c542;
            font-size: 0.85rem;
            margin-top: 0.2rem;
            min-height: 1.4rem;
            font-weight: 500;
        }
        .status-text.idle {
            color: #8a9aa8;
        }
        .data-section {
            margin-top: 1.2rem;
            border-top: 1px solid rgba(255, 215, 0, 0.12);
            padding-top: 1.2rem;
        }
        .data-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem;
            margin-bottom: 0.8rem;
        }
        .data-tabs .tab-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.1);
            border-radius: 40px;
            padding: 0.2rem 1rem;
            color: #b7b9b0;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .data-tabs .tab-btn:hover {
            background: rgba(255, 215, 0, 0.08);
        }
        .data-tabs .tab-btn.active {
            background: rgba(255, 215, 0, 0.15);
            border-color: #ffd700;
            color: #ffd700;
        }
        .data-panel {
            display: none;
            animation: fadeIn 0.3s ease;
        }
        .data-panel.active {
            display: block;
        }
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(6px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem 0.6rem;
            align-items: center;
            padding: 0.5rem 0.8rem;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 1.2rem;
            border: 1px solid rgba(255, 215, 0, 0.05);
            margin-bottom: 0.6rem;
        }
        .filter-bar .filter-label {
            color: #b7b9b0;
            font-size: 0.65rem;
            letter-spacing: 1px;
        }
        .filter-bar .filter-group {
            display: flex;
            flex-wrap: wrap;
            gap: 0.15rem;
        }
        .filter-bar .filter-btn {
            padding: 0.05rem 0.5rem;
            border-radius: 30px;
            border: 1px solid #3a4d5a;
            background: transparent;
            color: #8a9aa8;
            font-size: 0.6rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
        }
        .filter-bar .filter-btn:hover {
            border-color: #6a8a9a;
            color: #d4d9c0;
        }
        .filter-bar .filter-btn.active {
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.12);
            color: #ffd700;
        }
        .filter-bar .filter-btn.active-special {
            border-color: #ff6b6b;
            background: rgba(255, 107, 107, 0.12);
            color: #ff6b6b;
        }
        .filter-bar .filter-divider {
            color: #3a4d5a;
            font-size: 0.6rem;
        }
        .year-group {
            margin-bottom: 0.6rem;
        }
        .year-group .year-header {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.2rem 0.6rem;
            background: rgba(255, 215, 0, 0.06);
            border-radius: 30px;
            border: 1px solid rgba(255, 215, 0, 0.08);
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 0.3rem;
        }
        .year-group .year-header:hover {
            background: rgba(255, 215, 0, 0.1);
        }
        .year-group .year-header .year-label {
            color: #ffd700;
            font-weight: 600;
            font-size: 0.85rem;
        }
        .year-group .year-header .year-count {
            color: #667a88;
            font-size: 0.65rem;
            margin-left: auto;
        }
        .year-group .year-header .year-arrow {
            color: #667a88;
            transition: transform 0.3s;
            font-size: 0.7rem;
        }
        .year-group .year-header .year-arrow.open {
            transform: rotate(90deg);
        }
        .year-group .year-records {
            padding-left: 0.3rem;
            display: none;
        }
        .year-group .year-records.open {
            display: block;
        }
        .history-item {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 0.6rem;
            padding: 0.3rem 0.6rem;
            margin-bottom: 0.2rem;
            border: 1px solid rgba(255, 215, 0, 0.04);
            transition: all 0.2s;
        }
        .history-item.dimmed {
            opacity: 0.2;
        }
        .history-item .period-time {
            color: #ffd700;
            font-size: 0.65rem;
            font-weight: 600;
            margin-bottom: 0.1rem;
        }
        .history-item .balls-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.15rem 0.3rem;
            margin-bottom: 0.1rem;
        }
        .history-item .balls-row .h-ball {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            font-size: 0.65rem;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.2s;
        }
        .history-item .balls-row .h-ball.h-red {
            background: radial-gradient(circle at 30% 28%, #ff6b6b, #c0392b);
        }
        .history-item .balls-row .h-ball.h-blue {
            background: radial-gradient(circle at 30% 28%, #6b9fff, #1a4c8b);
        }
        .history-item .balls-row .h-ball.h-green {
            background: radial-gradient(circle at 30% 28%, #6bda6b, #1a7a2a);
        }
        .history-item .balls-row .h-ball.h-special {
            border: 2px solid #ffd700;
            box-shadow: 0 0 8px rgba(255, 215, 0, 0.12);
        }
        .history-item .balls-row .h-ball.dimmed {
            opacity: 0.15;
            filter: grayscale(0.8);
        }
        .history-item .balls-row .h-ball.highlight {
            box-shadow: 0 0 12px rgba(255, 215, 0, 0.35);
            border-color: #ffd700;
        }
        .history-item .ball-unit {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.05rem;
        }
        .history-item .ball-unit .z-under-ball {
            font-size: 0.5rem;
            color: #b7b9b0;
            min-width: 20px;
            text-align: center;
        }
        .history-item .ball-unit .z-under-ball.z-special {
            color: #ffd700;
            font-weight: 600;
        }
        .empty-history {
            color: #667a88;
            font-style: italic;
            font-size: 0.75rem;
            padding: 0.5rem;
            text-align: center;
        }
        .stats-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem 0.6rem;
            align-items: center;
            margin-bottom: 0.6rem;
        }
        .stats-toolbar .stats-label {
            color: #b7b9b0;
            font-size: 0.65rem;
            letter-spacing: 1px;
        }
        .btn-sm {
            padding: 0.15rem 0.8rem;
            font-size: 0.7rem;
            min-width: auto;
            border-radius: 60px;
            font-weight: 600;
            color: #1b2a3a;
            cursor: pointer;
            transition: all 0.15s;
            border: 1px solid #f9edc7;
            background: #eddbc0;
            box-shadow: 0 3px 0 #7a6b50;
        }
        .btn-sm:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #5f4f38;
        }
        .btn-sm.active {
            background: #ffd700;
            border-color: #ffd700;
            color: #1a1a1a;
            box-shadow: 0 3px 0 #b8860b;
        }
        .stats-grid-wrapper {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 0.8rem;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.15rem 0.2rem;
            max-height: 300px;
            overflow-y: auto;
            padding: 0.15rem 0;
        }
        .stats-grid .stat-item {
            display: flex;
            align-items: center;
            gap: 0.05rem;
            font-size: 0.7rem;
            color: #c8cdc0;
            background: rgba(255, 255, 200, 0.03);
            padding: 0.08rem 0.2rem;
            border-radius: 10px;
            border: 1px solid #2a3d4a;
            border-left: 3px solid #555;
            transition: all 0.2s;
        }
        .stats-grid .stat-item .stat-num {
            font-weight: 700;
            color: #f5e7b0;
            min-width: 16px;
            text-align: center;
            font-size: 0.7rem;
        }
        .stats-grid .stat-item .stat-freq {
            background: #2a4050;
            padding: 0 0.15rem;
            border-radius: 10px;
            color: #d4d9c0;
            font-size: 0.55rem;
            min-width: 12px;
            text-align: center;
        }
        .stats-grid .stat-item .stat-bar {
            height: 4px;
            border-radius: 3px;
            background: rgba(255, 215, 0, 0.3);
            transition: width 0.5s;
            margin-left: 2px;
        }
        .stats-grid .stat-item.red-dot {
            border-left-color: #ff6b6b;
        }
        .stats-grid .stat-item.blue-dot {
            border-left-color: #6b9fff;
        }
        .stats-grid .stat-item.green-dot {
            border-left-color: #6bda6b;
        }
        .stats-grid .stat-item .stat-bar.red-bar {
            background: #ff6b6b;
        }
        .stats-grid .stat-item .stat-bar.blue-bar {
            background: #6b9fff;
        }
        .stats-grid .stat-item .stat-bar.green-bar {
            background: #6bda6b;
        }
        .zodiac-stats {
            background: rgba(0, 0, 0, 0.15);
            border-radius: 1rem;
            padding: 0.5rem 0.6rem;
            border: 1px solid rgba(255, 215, 0, 0.05);
        }
        .zodiac-stats .zodiac-title {
            color: #b7b9b0;
            font-size: 0.65rem;
            letter-spacing: 1px;
            margin-bottom: 0.3rem;
            text-align: center;
        }
        .zodiac-stats .zodiac-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.15rem 0.3rem;
        }
        .zodiac-stats .zodiac-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.1rem 0.3rem;
            border-radius: 12px;
            font-size: 0.6rem;
            color: #b7b9b0;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .zodiac-stats .zodiac-item .z-name {
            font-weight: 600;
        }
        .zodiac-stats .zodiac-item .z-count {
            background: rgba(0, 0, 0, 0.3);
            padding: 0 0.3rem;
            border-radius: 10px;
            color: #ffd700;
            font-weight: 600;
            font-size: 0.55rem;
        }
        .zodiac-stats .zodiac-item .z-bar-wrap {
            flex: 1;
            margin: 0 0.2rem;
            height: 4px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
            overflow: hidden;
        }
        .zodiac-stats .zodiac-item .z-bar-wrap .z-bar {
            height: 100%;
            border-radius: 4px;
            background: linear-gradient(90deg, #ffd700, #f5a623);
            transition: width 0.5s;
        }
        .stats-summary {
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem 1rem;
            padding: 0.3rem 0.5rem;
            margin-top: 0.3rem;
            background: rgba(0, 0, 0, 0.15);
            border-radius: 0.8rem;
            font-size: 0.65rem;
            color: #b7b9b0;
            grid-column: 1 / -1;
        }
        .stats-summary span {
            color: #f5e7b0;
            font-weight: 600;
        }
        .empty-stats {
            color: #667a88;
            font-style: italic;
            font-size: 0.75rem;
            text-align: center;
            grid-column: 1 / -1;
            padding: 0.5rem;
        }
        .footer-note {
            text-align: center;
            margin-top: 0.8rem;
            color: #7e8f9a;
            font-size: 0.6rem;
            letter-spacing: 0.8px;
            opacity: 0.6;
        }
        .back-link {
            display: inline-block;
            margin-top: 0.5rem;
            color: #667a88;
            text-decoration: none;
            font-size: 0.8rem;
            transition: color 0.2s;
        }
        .back-link:hover {
            color: #f6e9b0;
        }

        @media (max-width: 768px) {
            .card { padding: 1rem 0.8rem 1.2rem; border-radius: 1.5rem; }
            .ball { width: 46px; height: 46px; font-size: 1.4rem; }
            .stats-grid-wrapper { grid-template-columns: 1fr; gap: 0.5rem; }
            .stats-grid { grid-template-columns: repeat(4, 1fr); }
            .filter-bar { flex-direction: column; align-items: stretch; gap: 0.2rem; padding: 0.4rem 0.6rem; }
            .filter-bar .filter-divider { display: none; }
            .history-item .balls-row .h-ball { width: 20px; height: 20px; font-size: 0.55rem; }
            .status-bar { flex-direction: column; align-items: stretch; text-align: center; gap: 0.2rem; }
        }
        @media (max-width: 480px) {
            body { padding: 0.3rem; }
            .card { padding: 0.6rem 0.4rem 0.8rem; border-radius: 1rem; }
            .ball { width: 34px; height: 34px; font-size: 1rem; }
            .zodiac-label { font-size: 0.45rem; }
            .number-area { gap: 0.3rem 0.6rem; min-height: 60px; }
            .main-numbers { gap: 0.2rem; }
            .history-item .balls-row .h-ball { width: 18px; height: 18px; font-size: 0.5rem; }
            .history-item .ball-unit .z-under-ball { font-size: 0.4rem; }
            .stats-grid { grid-template-columns: repeat(4, 1fr); gap: 0.1rem; }
            .stats-grid .stat-item { font-size: 0.5rem; padding: 0.05rem 0.1rem; border-left-width: 2px; border-radius: 6px; }
            .stats-grid .stat-item .stat-num { font-size: 0.5rem; min-width: 12px; }
            .stats-grid .stat-item .stat-freq { font-size: 0.45rem; min-width: 8px; padding: 0 0.1rem; }
            .stats-grid .stat-item .stat-bar { display: none; }
            .zodiac-stats .zodiac-grid { grid-template-columns: repeat(2, 1fr); }
            .zodiac-stats .zodiac-item { font-size: 0.5rem; padding: 0.05rem 0.15rem; }
            .stats-summary { font-size: 0.5rem; gap: 0.1rem 0.3rem; padding: 0.15rem 0.2rem; }
            .filter-bar .filter-btn { font-size: 0.45rem; padding: 0.03rem 0.3rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <h1>🎰 六合彩 <span>开奖系统</span></h1>
                <div class="period-badge">📅 第 <span id="periodDisplay">000</span> 期</div>
            </div>
            <div class="lottery-panel">
                <div class="number-area">
                    <div class="main-numbers" id="mainNumbers"></div>
                </div>
                <div class="status-bar">
                    <div class="draw-time">⏰ 下次开奖: <span id="nextDrawTime">每天 20:30</span></div>
                    <div class="countdown">⏱ 倒计时: <span class="time" id="countdownDisplay">--:--:--</span></div>
                </div>
                <div class="status-text idle" id="statusText">加载数据...</div>
            </div>
            <div class="data-section">
                <div class="data-tabs">
                    <button class="tab-btn active" data-tab="history">📋 开奖记录</button>
                    <button class="tab-btn" data-tab="stats">📊 号码/生肖频率</button>
                </div>
                <div class="data-panel active" id="panel-history">
                    <div class="filter-bar">
                        <span class="filter-label">📍 位置:</span>
                        <div class="filter-group" id="positionFilter">
                            <button class="filter-btn active" data-pos="all">全部</button>
                            <button class="filter-btn" data-pos="0">第1位</button>
                            <button class="filter-btn" data-pos="1">第2位</button>
                            <button class="filter-btn" data-pos="2">第3位</button>
                            <button class="filter-btn" data-pos="3">第4位</button>
                            <button class="filter-btn" data-pos="4">第5位</button>
                            <button class="filter-btn" data-pos="5">第6位</button>
                            <button class="filter-btn active-special" data-pos="6">⭐特别号</button>
                        </div>
                        <span class="filter-divider">|</span>
                        <span class="filter-label">🐾 生肖:</span>
                        <div class="filter-group" id="zodiacFilter">
                            <button class="filter-btn active" data-zodiac="all">全部</button>
                            <button class="filter-btn" data-zodiac="蛇">蛇</button>
                            <button class="filter-btn" data-zodiac="龙">龙</button>
                            <button class="filter-btn" data-zodiac="猫">猫</button>
                            <button class="filter-btn" data-zodiac="虎">虎</button>
                            <button class="filter-btn" data-zodiac="牛">牛</button>
                            <button class="filter-btn" data-zodiac="鼠">鼠</button>
                            <button class="filter-btn" data-zodiac="猪">猪</button>
                            <button class="filter-btn" data-zodiac="狗">狗</button>
                            <button class="filter-btn" data-zodiac="鸡">鸡</button>
                            <button class="filter-btn" data-zodiac="猴">猴</button>
                            <button class="filter-btn" data-zodiac="羊">羊</button>
                            <button class="filter-btn" data-zodiac="马">马</button>
                        </div>
                    </div>
                    <div id="historyList"><span class="empty-history">暂无记录</span></div>
                </div>
                <div class="data-panel" id="panel-stats">
                    <div class="stats-toolbar">
                        <span class="stats-label">📅 时间范围:</span>
                        <button class="btn-sm active" data-range="all">全部</button>
                        <button class="btn-sm" data-range="week">本周</button>
                        <button class="btn-sm" data-range="month">本月</button>
                        <button class="btn-sm" data-range="year">本年</button>
                        <span style="color:#667a88;font-size:0.7rem;margin-left:auto;" id="statsInfo">共 0 期</span>
                    </div>
                    <div class="stats-grid-wrapper">
                        <div class="stats-grid" id="statsGrid"><span class="empty-stats">暂无数据</span></div>
                        <div class="zodiac-stats" id="zodiacStats">
                            <div class="zodiac-title">🐾 生肖频率</div>
                            <div class="zodiac-grid" id="zodiacStatsGrid">
                                <span class="empty-stats">暂无数据</span>
                            </div>
                        </div>
                    </div>
                    <div class="stats-summary" id="statsSummary">
                        <span>📊 总开奖: <span id="totalDraws">0</span> 期</span>
                        <span>🎯 号码覆盖: <span id="coveredNums">0</span>/49</span>
                        <span>🔥 最热号码: <span id="hottestNum">-</span> (<span id="hottestFreq">0</span>次)</span>
                        <span>❄️ 最冷号码: <span id="coldestNum">-</span> (<span id="coldestFreq">0</span>次)</span>
                    </div>
                </div>
            </div>
            <a href="/" class="back-link">← 返回首页</a>
            <div class="footer-note">🎯 7个号码 · 数据来自后端API · 实时更新</div>
        </div>
    </div>

    <script>
        // ============================================================
        //  DOM 引用
        // ============================================================
        const mainContainer = document.getElementById('mainNumbers');
        const periodDisplay = document.getElementById('periodDisplay');
        const statusText = document.getElementById('statusText');
        const historyList = document.getElementById('historyList');
        const statsGrid = document.getElementById('statsGrid');
        const zodiacStatsGrid = document.getElementById('zodiacStatsGrid');
        const statsInfo = document.getElementById('statsInfo');
        const totalDrawsEl = document.getElementById('totalDraws');
        const coveredNumsEl = document.getElementById('coveredNums');
        const hottestNumEl = document.getElementById('hottestNum');
        const hottestFreqEl = document.getElementById('hottestFreq');
        const coldestNumEl = document.getElementById('coldestNum');
        const coldestFreqEl = document.getElementById('coldestFreq');
        const countdownDisplay = document.getElementById('countdownDisplay');
        const nextDrawTimeEl = document.getElementById('nextDrawTime');

        // ============================================================
        //  状态
        // ============================================================
        let currentMain = [];
        let period = 0;
        let history = [];
        let frequency = {};
        let activePositions = ['all'];
        let activeZodiacs = ['all'];
        let currentRange = 'all';
        let expandedYears = new Set();
        let drawTime = '20:30';
        let countdownInterval = null;

        // ============================================================
        //  颜色/生肖映射
        // ============================================================
        const colorMap = {
            red: [1, 2, 7, 8, 12, 13, 18, 19, 23, 24, 29, 30, 34, 35, 40, 45, 46],
            blue: [3, 4, 9, 10, 14, 15, 20, 25, 26, 31, 36, 37, 41, 42, 47, 48],
            green: [5, 6, 11, 16, 17, 21, 22, 27, 28, 32, 33, 38, 39, 43, 44, 49]
        };

        function getColor(num) {
            if (colorMap.red.includes(num)) return 'red';
            if (colorMap.blue.includes(num)) return 'blue';
            if (colorMap.green.includes(num)) return 'green';
            return 'red';
        }

        const zodiacMap = {
            1: '蛇', 13: '蛇', 25: '蛇', 37: '蛇', 49: '蛇',
            2: '龙', 14: '龙', 26: '龙', 38: '龙',
            3: '猫', 15: '猫', 27: '猫', 39: '猫',
            4: '虎', 16: '虎', 28: '虎', 40: '虎',
            5: '牛', 17: '牛', 29: '牛', 41: '牛',
            6: '鼠', 18: '鼠', 30: '鼠', 42: '鼠',
            7: '猪', 19: '猪', 31: '猪', 43: '猪',
            8: '狗', 20: '狗', 32: '狗', 44: '狗',
            9: '鸡', 21: '鸡', 33: '鸡', 45: '鸡',
            10: '猴', 22: '猴', 34: '猴', 46: '猴',
            11: '羊', 23: '羊', 35: '羊', 47: '羊',
            12: '马', 24: '马', 36: '马', 48: '马'
        };

        function getZodiac(num) { return zodiacMap[num] || '-'; }

        // ============================================================
        //  创建球
        // ============================================================
        function createWaitingBall(index) {
            const wrapper = document.createElement('div');
            wrapper.className = 'ball-wrapper';
            const isSpecial = (index === 6);
            const ball = document.createElement('div');
            ball.className = `ball waiting${isSpecial ? ' special' : ''}`;
            ball.textContent = '?';
            wrapper.appendChild(ball);
            const label = document.createElement('div');
            label.className = `zodiac-label empty${isSpecial ? ' special' : ''}`;
            label.textContent = isSpecial ? '特别号' : '-';
            wrapper.appendChild(label);
            return wrapper;
        }

        function createStaticBall(num, index) {
            const wrapper = document.createElement('div');
            wrapper.className = 'ball-wrapper';
            const isSpecial = (index === 6);
            const ball = document.createElement('div');
            const color = getColor(num);
            ball.className = `ball color-${color}${isSpecial ? ' special' : ''}`;
            ball.textContent = num;
            wrapper.appendChild(ball);
            const label = document.createElement('div');
            label.className = `zodiac-label${isSpecial ? ' special' : ''}`;
            label.textContent = isSpecial ? '特别号' : getZodiac(num);
            wrapper.appendChild(label);
            return wrapper;
        }

        function setWaitingState() {
            mainContainer.innerHTML = '';
            for (let i = 0; i < 7; i++) {
                mainContainer.appendChild(createWaitingBall(i));
            }
        }

        // ============================================================
        //  倒计时计算
        // ============================================================
        function getNextDrawTime() {
            const now = new Date();
            const [hour, minute] = drawTime.split(':').map(Number);
            const vnOffset = 7;
            const localOffset = -now.getTimezoneOffset() / 60;
            const offsetDiff = vnOffset - localOffset;
            const next = new Date(now);
            next.setHours(hour - offsetDiff, minute, 0, 0);
            if (next < now) {
                next.setDate(next.getDate() + 1);
            }
            return next;
        }

        function updateCountdown() {
            const next = getNextDrawTime();
            const now = new Date();
            const diff = Math.max(0, Math.floor((next - now) / 1000));
            if (diff <= 0) {
                countdownDisplay.textContent = '即将开奖...';
                return;
            }
            const hours = Math.floor(diff / 3600);
            const minutes = Math.floor((diff % 3600) / 60);
            const seconds = diff % 60;
            countdownDisplay.textContent =
                `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        // ============================================================
        //  从后端加载数据
        // ============================================================
        async function loadConfig() {
            try {
                const response = await fetch('/api/admin/config');
                const result = await response.json();
                if (result.success && result.data) {
                    drawTime = result.data.drawTime || '20:30';
                    nextDrawTimeEl.textContent = `每天 ${drawTime}`;
                }
            } catch (e) {
                drawTime = '20:30';
                nextDrawTimeEl.textContent = `每天 ${drawTime}`;
            }
        }

        async function loadCurrentDraw() {
            try {
                const response = await fetch('/api/draw/current');
                const result = await response.json();
                if (result.success && result.data) {
                    const data = result.data;
                    currentMain = data.numbers || [];
                    period = data.period || 0;
                    periodDisplay.textContent = String(period).padStart(3, '0');
                    renderCurrentDraw(currentMain);
                    if (currentMain.length > 0) {
                        statusText.textContent = `📊 第${String(period).padStart(3, '0')}期已开奖`;
                        statusText.className = 'status-text';
                    } else {
                        statusText.textContent = '等待开奖...';
                        statusText.className = 'status-text idle';
                    }
                    return true;
                } else {
                    setWaitingState();
                    statusText.textContent = '等待开奖...';
                    statusText.className = 'status-text idle';
                    return false;
                }
            } catch (e) {
                console.error('加载开奖失败:', e);
                setWaitingState();
                statusText.textContent = '连接服务器...';
                statusText.className = 'status-text idle';
                return false;
            }
        }

        async function loadHistory() {
            try {
                const response = await fetch('/api/draw/history?limit=50');
                const result = await response.json();
                if (result.success && result.data) {
                    history = result.data.records || [];
                    renderHistory();
                }
            } catch (e) {
                console.error('加载历史失败:', e);
            }
        }

        async function loadFrequency() {
            try {
                const response = await fetch('/api/draw/frequency');
                const result = await response.json();
                if (result.success && result.data) {
                    const freq = {};
                    result.data.numbers.forEach(item => {
                        freq[item.number] = item.count;
                    });
                    frequency = freq;
                    renderStats();
                }
            } catch (e) {
                console.error('加载频率失败:', e);
            }
        }

        // ============================================================
        //  渲染当前开奖
        // ============================================================
        function renderCurrentDraw(main) {
            mainContainer.innerHTML = '';
            if (!main || main.length === 0) {
                for (let i = 0; i < 7; i++) {
                    mainContainer.appendChild(createWaitingBall(i));
                }
                return;
            }
            main.forEach((num, idx) => {
                mainContainer.appendChild(createStaticBall(num, idx));
            });
        }

        // ============================================================
        //  渲染历史记录
        // ============================================================
        function renderHistory() {
            historyList.innerHTML = '';
            if (history.length === 0) {
                historyList.innerHTML = '<span class="empty-history">暂无记录</span>';
                return;
            }

            const years = {};
            history.forEach(item => {
                const year = item.drawTime ? new Date(item.drawTime).getFullYear() : '未知';
                const key = String(year);
                if (!years[key]) years[key] = [];
                years[key].push(item);
            });

            const sortedYears = Object.keys(years).sort((a, b) => {
                if (a === '未知') return 1;
                if (b === '未知') return -1;
                return parseInt(b) - parseInt(a);
            });

            sortedYears.forEach(year => {
                const yearGroup = document.createElement('div');
                yearGroup.className = 'year-group';

                const header = document.createElement('div');
                header.className = 'year-header';
                const isOpen = expandedYears.has(year);
                header.innerHTML = `
                    <span class="year-label">📅 ${year}</span>
                    <span class="year-count">${years[year].length} 期</span>
                    <span class="year-arrow ${isOpen ? 'open' : ''}">▶</span>
                `;
                header.addEventListener('click', function() {
                    if (expandedYears.has(year)) {
                        expandedYears.delete(year);
                    } else {
                        expandedYears.add(year);
                    }
                    renderHistory();
                });
                yearGroup.appendChild(header);

                const records = document.createElement('div');
                records.className = `year-records${isOpen ? ' open' : ''}`;

                years[year].forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'history-item';

                    const shouldHighlight = checkHighlight(item);
                    if (!shouldHighlight) {
                        div.classList.add('dimmed');
                    }

                    const timeDiv = document.createElement('div');
                    timeDiv.className = 'period-time';
                    const drawTimeStr = item.drawTime ? new Date(item.drawTime).toLocaleString('zh-CN') : '--';
                    timeDiv.textContent = `第${String(item.period).padStart(3, '0')}期 开奖时间：${drawTimeStr}`;
                    div.appendChild(timeDiv);

                    const ballsRow = document.createElement('div');
                    ballsRow.className = 'balls-row';

                    item.numbers.forEach((num, idx) => {
                        const unit = document.createElement('div');
                        unit.className = 'ball-unit';
                        const isSpecial = (idx === 6);

                        const ball = document.createElement('div');
                        const color = getColor(num);
                        ball.className = `h-ball h-${color}${isSpecial ? ' h-special' : ''}`;
                        ball.textContent = num;

                        const posActive = activePositions.includes('all') || activePositions.includes(String(idx));
                        const zodiacActive = activeZodiacs.includes('all') || activeZodiacs.includes(getZodiac(num));

                        if (!shouldHighlight || !posActive || !zodiacActive) {
                            ball.classList.add('dimmed');
                        } else {
                            ball.classList.add('highlight');
                        }
                        unit.appendChild(ball);

                        const zLabel = document.createElement('div');
                        zLabel.className = `z-under-ball${isSpecial ? ' z-special' : ''}`;
                        zLabel.textContent = getZodiac(num);
                        if (!zodiacActive && shouldHighlight) {
                            zLabel.classList.add('dimmed');
                        } else if (zodiacActive && shouldHighlight) {
                            zLabel.classList.add('highlight');
                        }
                        unit.appendChild(zLabel);

                        ballsRow.appendChild(unit);
                    });

                    div.appendChild(ballsRow);
                    records.appendChild(div);
                });

                yearGroup.appendChild(records);
                historyList.appendChild(yearGroup);
            });
        }

        function checkHighlight(item) {
            if (activePositions.includes('all') && activeZodiacs.includes('all')) {
                return true;
            }

            let posMatch = activePositions.includes('all');
            if (!posMatch) {
                for (let i = 0; i < item.numbers.length; i++) {
                    if (activePositions.includes(String(i))) {
                        posMatch = true;
                        break;
                    }
                }
            }

            let zodiacMatch = activeZodiacs.includes('all');
            if (!zodiacMatch) {
                for (const num of item.numbers) {
                    if (activeZodiacs.includes(getZodiac(num))) {
                        zodiacMatch = true;
                        break;
                    }
                }
            }

            if (activePositions.includes('all') && activeZodiacs.includes('all')) return true;
            if (!activeZodiacs.includes('all') && !zodiacMatch) return false;
            if (!activePositions.includes('all') && !posMatch) return false;
            return posMatch && zodiacMatch;
        }

        // ============================================================
        //  渲染频率统计
        // ============================================================
        function renderStats() {
            const range = currentRange;
            let filteredHistory = [];

            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());

            if (range === 'all') {
                filteredHistory = history;
            } else if (range === 'week') {
                const weekStart = new Date(today);
                weekStart.setDate(today.getDate() - today.getDay() + 1);
                filteredHistory = history.filter(item => {
                    if (!item.drawTime) return false;
                    const d = new Date(item.drawTime);
                    return d >= weekStart;
                });
            } else if (range === 'month') {
                const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
                filteredHistory = history.filter(item => {
                    if (!item.drawTime) return false;
                    const d = new Date(item.drawTime);
                    return d >= monthStart;
                });
            } else if (range === 'year') {
                const yearStart = new Date(now.getFullYear(), 0, 1);
                filteredHistory = history.filter(item => {
                    if (!item.drawTime) return false;
                    const d = new Date(item.drawTime);
                    return d >= yearStart;
                });
            }

            const freq = {};
            let totalDraws = 0;
            filteredHistory.forEach(item => {
                totalDraws++;
                item.numbers.forEach(n => { freq[n] = (freq[n] || 0) + 1; });
            });

            totalDrawsEl.textContent = totalDraws;
            const numsWithFreq = Object.keys(freq).length;
            coveredNumsEl.textContent = numsWithFreq;

            let maxFreq = 0,
                minFreq = Infinity;
            let maxNum = '-',
                minNum = '-';
            for (const [num, f] of Object.entries(freq)) {
                if (f > maxFreq) { maxFreq = f;
                    maxNum = num; }
                if (f < minFreq) { minFreq = f;
                    minNum = num; }
            }
            if (maxFreq === 0) { maxFreq = 0;
                maxNum = '-'; }
            if (minFreq === Infinity) { minFreq = 0;
                minNum = '-'; }
            hottestNumEl.textContent = maxNum;
            hottestFreqEl.textContent = maxFreq;
            coldestNumEl.textContent = minNum;
            coldestFreqEl.textContent = minFreq;
            statsInfo.textContent = `共 ${totalDraws} 期`;

            statsGrid.innerHTML = '';
            let hasData = false;
            const maxFreqForBar = maxFreq > 0 ? maxFreq : 1;

            for (let i = 1; i <= 49; i++) {
                const f = freq[i] || 0;
                if (f > 0) hasData = true;
                const item = document.createElement('div');
                const color = getColor(i);
                const dotClass = color === 'red' ? 'red-dot' : color === 'blue' ? 'blue-dot' : 'green-dot';
                const barClass = color === 'red' ? 'red-bar' : color === 'blue' ? 'blue-bar' : 'green-bar';
                const barWidth = f > 0 ? Math.max(8, (f / maxFreqForBar) * 80) : 0;
                item.className = `stat-item ${dotClass}`;
                item.innerHTML = `
                    <span class="stat-num">${i}</span>
                    <span class="stat-freq">${f || '-'}</span>
                    <div class="stat-bar ${barClass}" style="width:${Math.min(barWidth, 50)}px;"></div>
                `;
                statsGrid.appendChild(item);
            }
            if (!hasData) {
                statsGrid.innerHTML = '<span class="empty-stats">暂无数据</span>';
            }

            renderZodiacStats(filteredHistory);
        }

        function renderZodiacStats(filteredHistory) {
            const zodiacFreq = {};
            const zodiacList = ['蛇', '龙', '猫', '虎', '牛', '鼠', '猪', '狗', '鸡', '猴', '羊', '马'];
            zodiacList.forEach(z => { zodiacFreq[z] = 0; });

            filteredHistory.forEach(item => {
                item.numbers.forEach(num => {
                    const z = getZodiac(num);
                    if (zodiacFreq[z] !== undefined) zodiacFreq[z]++;
                });
            });

            zodiacStatsGrid.innerHTML = '';
            let hasZodiacData = false;
            const maxZodiacFreq = Math.max(...Object.values(zodiacFreq), 1);

            for (const [z, count] of Object.entries(zodiacFreq)) {
                if (count > 0) hasZodiacData = true;
                const item = document.createElement('div');
                item.className = 'zodiac-item';
                const barWidth = count > 0 ? Math.max(10, (count / maxZodiacFreq) * 100) : 0;
                item.innerHTML = `
                    <span class="z-name">${z}</span>
                    <div class="z-bar-wrap"><div class="z-bar" style="width:${Math.min(barWidth, 100)}%;"></div></div>
                    <span class="z-count">${count}</span>
                `;
                zodiacStatsGrid.appendChild(item);
            }

            if (!hasZodiacData) {
                zodiacStatsGrid.innerHTML = '<span class="empty-stats">暂无数据</span>';
            }
        }

        // ============================================================
        //  刷新数据（轮询）
        // ============================================================
        async function refreshData() {
            try {
                const response = await fetch('/api/draw/current');
                const result = await response.json();
                if (result.success && result.data) {
                    const data = result.data;
                    const newPeriod = data.period || 0;
                    if (newPeriod !== period) {
                        period = newPeriod;
                        periodDisplay.textContent = String(period).padStart(3, '0');
                        currentMain = data.numbers || [];
                        renderCurrentDraw(currentMain);
                        await loadHistory();
                        await loadFrequency();
                        if (currentMain.length > 0) {
                            statusText.textContent = `🎉 第${String(period).padStart(3, '0')}期开奖完成！`;
                            statusText.className = 'status-text';
                        }
                    }
                }
            } catch (e) {
                // 静默失败
            }
        }

        // ============================================================
        //  筛选事件绑定
        // ============================================================
        function initFilters() {
            document.querySelectorAll('#positionFilter .filter-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const pos = this.dataset.pos;
                    if (pos === 'all') {
                        activePositions = ['all'];
                        document.querySelectorAll('#positionFilter .filter-btn').forEach(b => b.classList.remove('active', 'active-special'));
                        this.classList.add('active');
                    } else {
                        activePositions = activePositions.filter(p => p !== 'all');
                        const allBtn = document.querySelector('#positionFilter .filter-btn[data-pos="all"]');
                        allBtn.classList.remove('active');

                        const idx = activePositions.indexOf(pos);
                        if (idx >= 0) {
                            activePositions.splice(idx, 1);
                            this.classList.remove('active', 'active-special');
                        } else {
                            activePositions.push(pos);
                            if (pos === '6') {
                                this.classList.add('active-special');
                            } else {
                                this.classList.add('active');
                            }
                        }

                        if (activePositions.length === 0) {
                            activePositions = ['all'];
                            allBtn.classList.add('active');
                        }
                    }
                    renderHistory();
                });
            });

            document.querySelectorAll('#zodiacFilter .filter-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const zodiac = this.dataset.zodiac;
                    if (zodiac === 'all') {
                        activeZodiacs = ['all'];
                        document.querySelectorAll('#zodiacFilter .filter-btn').forEach(b => b.classList.remove('active'));
                        this.classList.add('active');
                    } else {
                        activeZodiacs = activeZodiacs.filter(z => z !== 'all');
                        const allBtn = document.querySelector('#zodiacFilter .filter-btn[data-zodiac="all"]');
                        allBtn.classList.remove('active');

                        const idx = activeZodiacs.indexOf(zodiac);
                        if (idx >= 0) {
                            activeZodiacs.splice(idx, 1);
                            this.classList.remove('active');
                        } else {
                            activeZodiacs.push(zodiac);
                            this.classList.add('active');
                        }

                        if (activeZodiacs.length === 0) {
                            activeZodiacs = ['all'];
                            allBtn.classList.add('active');
                        }
                    }
                    renderHistory();
                });
            });

            document.querySelectorAll('#panel-stats .btn-sm[data-range]').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('#panel-stats .btn-sm[data-range]').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentRange = this.dataset.range;
                    renderStats();
                });
            });
        }

        // ============================================================
        //  Tab切换
        // ============================================================
        function initTabs() {
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    document.querySelectorAll('.data-panel').forEach(p => p.classList.remove('active'));
                    document.getElementById('panel-' + this.dataset.tab).classList.add('active');
                });
            });
        }

        // ============================================================
        //  初始化
        // ============================================================
        async function init() {
            await loadConfig();
            await loadCurrentDraw();
            await loadHistory();
            await loadFrequency();

            updateCountdown();
            countdownInterval = setInterval(updateCountdown, 1000);

            setInterval(refreshData, 10000);
            setInterval(async () => { await loadFrequency(); }, 30000);
            setInterval(async () => { await loadHistory(); }, 60000);

            initFilters();
            initTabs();
        }

        init();
    </script>
</body>
</html>
