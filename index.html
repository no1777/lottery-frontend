<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes" />
    <title>🎰 六合彩 · 开奖系统</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: linear-gradient(145deg, #0b1a2e 0%, #1a2f44 100%); min-height: 100vh; font-family: 'Segoe UI', Roboto, system-ui, sans-serif; padding: 1rem; display: flex; justify-content: center; align-items: flex-start; }
        .container { max-width: 1100px; width: 100%; }
        .card { background: rgba(255,255,255,0.07); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-radius: 2rem; padding: 1.5rem 1.2rem 1.8rem; box-shadow: 0 25px 50px -8px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.06); border: 1px solid rgba(255,215,100,0.15); margin-bottom: 1rem; }
        .header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem; }
        .header h1 { font-size: 1.8rem; font-weight: 500; color: #f6e9b0; text-shadow: 0 2px 8px rgba(255,200,50,0.3); display: flex; align-items: center; gap: 0.4rem; }
        .period-badge { background: rgba(255,215,0,0.12); padding: 0.3rem 1.2rem; border-radius: 60px; color: #ffd700; font-size: 1.1rem; font-weight: 600; border: 1px solid rgba(255,215,0,0.2); }
        .period-badge #periodDisplay { font-size: 1.5rem; color: #fff; }
        .lottery-panel { background: rgba(10,20,30,0.5); border-radius: 1.5rem; padding: 1.2rem 0.8rem; border: 1px solid rgba(255,215,0,0.08); }
        .number-area { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 0.8rem 1.5rem; min-height: 110px; }
        .main-numbers { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.6rem; }
        .ball-wrapper { display: flex; flex-direction: column; align-items: center; gap: 0.2rem; }
        .ball { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; font-weight: 700; color: #fff; box-shadow: 0 4px 0 rgba(0,0,0,0.4), 0 6px 16px rgba(0,0,0,0.5); border: 2px solid rgba(255,255,255,0.15); text-shadow: 0 2px 4px rgba(0,0,0,0.3); flex-shrink: 0; transition: all 0.2s; }
        .ball.special { border-color: #ffd700; box-shadow: 0 4px 0 #b8860b, 0 0 24px rgba(255,215,0,0.15); width: 52px; height: 52px; font-size: 1.8rem; }
        .ball.color-red { background: radial-gradient(circle at 30% 28%, #ff6b6b, #c0392b); }
        .ball.color-blue { background: radial-gradient(circle at 30% 28%, #6b9fff, #1a4c8b); }
        .ball.color-green { background: radial-gradient(circle at 30% 28%, #6bda6b, #1a7a2a); }
        .ball.waiting { background: rgba(40,50,60,0.6); color: #8a9aa8; box-shadow: inset 0 2px 8px rgba(0,0,0,0.5); border: 2px dashed rgba(255,200,100,0.15); box-shadow: none; backdrop-filter: blur(4px); }
        .ball.reveal { animation: revealPop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
        @keyframes revealPop { 0% { transform: scale(0.2) rotate(-15deg); opacity: 0; } 100% { transform: scale(1) rotate(0deg); opacity: 1; } }
        .ball.rolling { animation: slotRoll 0.12s linear infinite; }
        @keyframes slotRoll { 0% { transform: scale(0.9) rotate(-8deg); filter: brightness(1.2); } 50% { transform: scale(1.1) rotate(8deg); filter: brightness(1.6); box-shadow: 0 0 40px rgba(255,215,0,0.5); } 100% { transform: scale(0.9) rotate(-8deg); filter: brightness(1.2); } }
        .ball.stopped { animation: stopPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
        @keyframes stopPop { 0% { transform: scale(0.3) rotate(-20deg); opacity: 0.5; } 100% { transform: scale(1) rotate(0deg); opacity: 1; } }
        .zodiac-label { font-size: 0.8rem; font-weight: 600; color: #f0e6c0; min-height: 1.2rem; line-height: 1.2rem; background: rgba(0,0,0,0.3); padding: 0 0.5rem; border-radius: 20px; border: 1px solid rgba(255,215,0,0.08); }
        .zodiac-label.empty { color: #667a88; }
        .status-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.5rem; padding: 0.4rem 0.8rem; background: rgba(0,0,0,0.2); border-radius: 40px; border: 1px solid rgba(255,215,0,0.06); }
        .status-bar .draw-time { color: #b7b9b0; font-size: 0.85rem; }
        .status-bar .draw-time span { color: #ffd700; font-weight: 600; }
        .status-bar .countdown { color: #f5c542; font-size: 1rem; font-weight: 600; }
        .status-bar .countdown .time { color: #ffd700; font-size: 1.2rem; }
        .status-text { text-align: center; color: #f5c542; font-size: 0.95rem; margin-top: 0.2rem; min-height: 1.6rem; font-weight: 500; }
        .status-text.idle { color: #8a9aa8; }
        .data-section { margin-top: 1.2rem; border-top: 1px solid rgba(255,215,0,0.12); padding-top: 1.2rem; }
        .data-tabs { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-bottom: 0.8rem; }
        .data-tabs .tab-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,215,0,0.1); border-radius: 40px; padding: 0.3rem 1.2rem; color: #b7b9b0; font-size: 0.9rem; font-weight: 500; cursor: pointer; transition: all 0.2s; }
        .data-tabs .tab-btn:hover { background: rgba(255,215,0,0.08); }
        .data-tabs .tab-btn.active { background: rgba(255,215,0,0.15); border-color: #ffd700; color: #ffd700; }
        .data-panel { display: none; animation: fadeIn 0.3s ease; }
        .data-panel.active { display: block; }
        @keyframes fadeIn { 0% { opacity: 0; transform: translateY(6px); } 100% { opacity: 1; transform: translateY(0); } }
        .filter-bar { display: flex; flex-wrap: wrap; gap: 0.3rem 0.6rem; align-items: center; padding: 0.6rem 0.8rem; background: rgba(0,0,0,0.2); border-radius: 1.2rem; border: 1px solid rgba(255,215,0,0.05); margin-bottom: 0.6rem; }
        .filter-bar .filter-label { color: #b7b9b0; font-size: 0.75rem; letter-spacing: 1px; }
        .filter-bar .filter-group { display: flex; flex-wrap: wrap; gap: 0.15rem; }
        .filter-bar .filter-btn { padding: 0.08rem 0.6rem; border-radius: 30px; border: 1px solid #3a4d5a; background: transparent; color: #8a9aa8; font-size: 0.7rem; font-weight: 500; cursor: pointer; transition: all 0.15s; }
        .filter-bar .filter-btn:hover { border-color: #6a8a9a; color: #d4d9c0; }
        .filter-bar .filter-btn.active { border-color: #ffd700; background: rgba(255,215,0,0.12); color: #ffd700; }
        .filter-bar .filter-btn.active-special { border-color: #ff6b6b; background: rgba(255,107,107,0.12); color: #ff6b6b; }
        .filter-bar .filter-divider { color: #3a4d5a; font-size: 0.6rem; }
        .year-group { margin-bottom: 0.6rem; }
        .year-group .year-header { display: flex; align-items: center; gap: 0.4rem; padding: 0.3rem 0.6rem; background: rgba(255,215,0,0.06); border-radius: 30px; border: 1px solid rgba(255,215,0,0.08); cursor: pointer; transition: all 0.2s; margin-bottom: 0.3rem; }
        .year-group .year-header:hover { background: rgba(255,215,0,0.1); }
        .year-group .year-header .year-label { color: #ffd700; font-weight: 600; font-size: 0.95rem; }
        .year-group .year-header .year-count { color: #667a88; font-size: 0.75rem; margin-left: auto; }
        .year-group .year-header .year-arrow { color: #667a88; transition: transform 0.3s; font-size: 0.7rem; }
        .year-group .year-header .year-arrow.open { transform: rotate(90deg); }
        .year-group .year-records { padding-left: 0.3rem; display: none; }
        .year-group .year-records.open { display: block; }
        .history-item { background: rgba(0,0,0,0.2); border-radius: 0.6rem; padding: 0.5rem 0.8rem; margin-bottom: 0.25rem; border: 1px solid rgba(255,215,0,0.04); transition: all 0.2s; }
        .history-item.dimmed { opacity: 0.2; }
        .history-item .period-time { color: #ffd700; font-size: 0.8rem; font-weight: 600; margin-bottom: 0.15rem; }
        .history-item .balls-row { display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem 0.6rem; margin-bottom: 0.1rem; }
        .history-item .ball-unit { display: flex; flex-direction: column; align-items: center; gap: 0.05rem; }
        .history-item .balls-row .h-ball { display: inline-flex; align-items: center; justify-content: center; width: 2.0rem; height: 2.0rem; border-radius: 50%; font-size: 0.85rem; font-weight: 700; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.12); transition: all 0.2s; }
        .history-item .balls-row .h-ball.h-special { width: 2.4rem; height: 2.4rem; font-size: 1rem; border: 2px solid #ffd700; box-shadow: 0 0 10px rgba(255,215,0,0.15); }
        .history-item .balls-row .h-ball.h-red { background: radial-gradient(circle at 30% 28%, #ff6b6b, #c0392b); }
        .history-item .balls-row .h-ball.h-blue { background: radial-gradient(circle at 30% 28%, #6b9fff, #1a4c8b); }
        .history-item .balls-row .h-ball.h-green { background: radial-gradient(circle at 30% 28%, #6bda6b, #1a7a2a); }
        .history-item .balls-row .h-ball.dimmed { opacity: 0.15; filter: grayscale(0.8); }
        .history-item .balls-row .h-ball.highlight { box-shadow: 0 0 14px rgba(255,215,0,0.35); border-color: #ffd700; }
        .history-item .ball-unit .z-under-ball { font-size: 0.75rem; color: #b7b9b0; min-width: 2rem; text-align: center; transition: all 0.2s; line-height: 1.2; padding: 0.05rem 0; }
        .history-item .ball-unit .z-under-ball.dimmed { opacity: 0.15; }
        .history-item .ball-unit .z-under-ball.z-special { color: #ffd700; font-weight: 700; font-size: 0.85rem; }
        .history-item .ball-unit .z-under-ball.highlight { color: #ffd700; font-weight: 700; background: rgba(255,215,0,0.08); border-radius: 4px; }
        .empty-history { color: #667a88; font-style: italic; font-size: 0.85rem; padding: 0.5rem; text-align: center; }
        .stats-toolbar { display: flex; flex-wrap: wrap; gap: 0.3rem 0.6rem; align-items: center; margin-bottom: 0.6rem; }
        .stats-toolbar .stats-label { color: #b7b9b0; font-size: 0.75rem; letter-spacing: 1px; }
        .btn-sm { padding: 0.2rem 0.9rem; font-size: 0.8rem; min-width: auto; border-radius: 60px; font-weight: 600; color: #1b2a3a; cursor: pointer; transition: all 0.15s; border: 1px solid #f9edc7; background: #eddbc0; box-shadow: 0 3px 0 #7a6b50; }
        .btn-sm:active { transform: translateY(2px); box-shadow: 0 1px 0 #5f4f38; }
        .btn-sm.active { background: #ffd700; border-color: #ffd700; color: #1a1a1a; box-shadow: 0 3px 0 #b8860b; }
        .stats-grid-wrapper { display: grid; grid-template-columns: 2fr 1fr; gap: 0.8rem; }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.2rem 0.3rem; max-height: 320px; overflow-y: auto; padding: 0.15rem 0; }
        .stats-grid .stat-item { display: flex; align-items: center; gap: 0.1rem; font-size: 0.85rem; color: #c8cdc0; background: rgba(255,255,200,0.03); padding: 0.1rem 0.25rem; border-radius: 10px; border: 1px solid #2a3d4a; border-left: 3px solid #555; transition: all 0.2s; }
        .stats-grid .stat-item .stat-num { font-weight: 700; color: #f5e7b0; min-width: 20px; text-align: center; font-size: 0.85rem; }
        .stats-grid .stat-item .stat-freq { background: #2a4050; padding: 0 0.2rem; border-radius: 10px; color: #d4d9c0; font-size: 0.7rem; min-width: 16px; text-align: center; }
        .stats-grid .stat-item .stat-bar { height: 5px; border-radius: 3px; background: rgba(255,215,0,0.3); transition: width 0.5s; margin-left: 2px; min-width: 15px; }
        .stats-grid .stat-item.red-dot { border-left-color: #ff6b6b; }
        .stats-grid .stat-item.blue-dot { border-left-color: #6b9fff; }
        .stats-grid .stat-item.green-dot { border-left-color: #6bda6b; }
        .stats-grid .stat-item .stat-bar.red-bar { background: #ff6b6b; }
        .stats-grid .stat-item .stat-bar.blue-bar { background: #6b9fff; }
        .stats-grid .stat-item .stat-bar.green-bar { background: #6bda6b; }
        .zodiac-stats { background: rgba(0,0,0,0.15); border-radius: 1rem; padding: 0.5rem 0.6rem; border: 1px solid rgba(255,215,0,0.05); }
        .zodiac-stats .zodiac-title { color: #b7b9b0; font-size: 0.8rem; letter-spacing: 1px; margin-bottom: 0.3rem; text-align: center; }
        .zodiac-stats .zodiac-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.15rem 0.3rem; }
        .zodiac-stats .zodiac-item { display: flex; justify-content: space-between; align-items: center; padding: 0.15rem 0.3rem; border-radius: 12px; font-size: 0.75rem; color: #b7b9b0; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.04); }
        .zodiac-stats .zodiac-item .z-name { font-weight: 600; font-size: 0.8rem; }
        .zodiac-stats .zodiac-item .z-count { background: rgba(0,0,0,0.3); padding: 0 0.3rem; border-radius: 10px; color: #ffd700; font-weight: 600; font-size: 0.7rem; min-width: 20px; text-align: center; }
        .zodiac-stats .zodiac-item .z-bar-wrap { flex: 1; margin: 0 0.2rem; height: 5px; background: rgba(255,255,255,0.05); border-radius: 4px; overflow: hidden; }
        .zodiac-stats .zodiac-item .z-bar-wrap .z-bar { height: 100%; border-radius: 4px; background: linear-gradient(90deg, #ffd700, #f5a623); transition: width 0.5s; min-width: 10px; }
        .stats-summary { display: flex; flex-wrap: wrap; gap: 0.5rem 1.2rem; padding: 0.3rem 0.5rem; margin-top: 0.3rem; background: rgba(0,0,0,0.15); border-radius: 0.8rem; font-size: 0.75rem; color: #b7b9b0; grid-column: 1 / -1; }
        .stats-summary .stat-item-summary { display: flex; align-items: center; gap: 0.2rem; }
        .stats-summary .stat-item-summary .label { color: #b7b9b0; }
        .stats-summary .stat-item-summary .value { color: #f5e7b0; font-weight: 600; }
        .empty-stats { color: #667a88; font-style: italic; font-size: 0.85rem; text-align: center; grid-column: 1 / -1; padding: 0.5rem; }
        .footer-note { text-align: center; margin-top: 0.8rem; color: #7e8f9a; font-size: 0.7rem; letter-spacing: 0.8px; opacity: 0.6; }
        .nav-links { display: flex; justify-content: center; gap: 1rem; margin-top: 0.5rem; flex-wrap: wrap; }
        .nav-links a { color: #667a88; text-decoration: none; font-size: 0.85rem; transition: color 0.2s; padding: 0.2rem 0.8rem; border-radius: 20px; border: 1px solid rgba(255,215,0,0.05); }
        .nav-links a:hover { color: #f6e9b0; border-color: rgba(255,215,0,0.15); }
        .lang-switch { display: flex; gap: 0.2rem; align-items: center; }
        .lang-btn { background: transparent; border: 1px solid #3a4d5a; color: #b7b9b0; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; font-size: 0.7rem; font-weight: 600; transition: all 0.2s; display: flex; align-items: center; justify-content: center; }
        .lang-btn:hover { border-color: #ffd700; color: #ffd700; }
        .lang-btn.active { background: rgba(255,215,0,0.2); border-color: #ffd700; color: #ffd700; }
        @media (max-width: 768px) { .card { padding: 1rem 0.8rem 1.2rem; border-radius: 1.5rem; } .ball { width: 52px; height: 52px; font-size: 1.6rem; } .ball.special { width: 60px; height: 60px; font-size: 2rem; } .stats-grid-wrapper { grid-template-columns: 1fr; } .filter-bar { flex-direction: column; align-items: stretch; } }
        @media (max-width: 480px) { body { padding: 0.3rem; } .card { padding: 0.6rem 0.4rem 0.8rem; border-radius: 1rem; } .header h1 { font-size: 1.2rem; } .ball { width: 36px; height: 36px; font-size: 1.1rem; } .ball.special { width: 42px; height: 42px; font-size: 1.3rem; } .period-badge { font-size: 0.8rem; padding: 0.1rem 0.6rem; } .period-badge #periodDisplay { font-size: 1.1rem; } .stats-grid { grid-template-columns: repeat(4, 1fr); } }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="header">
            <h1 data-i18n="app_title">🎰 六合彩 · 开奖系统</h1>
            <div style="display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap;">
                <div class="period-badge"><span data-i18n="period_display">📅 第 000 期</span></div>
                <div class="lang-switch">
                    <button class="lang-btn active" data-lang="zh">中</button>
                    <button class="lang-btn" data-lang="vi">Vi</button>
                </div>
            </div>
        </div>
        <div class="lottery-panel">
            <div class="number-area">
                <div class="main-numbers" id="mainNumbers"></div>
            </div>
            <div class="status-bar">
                <div class="draw-time"><span data-i18n="draw_time_label">⏰ 下次开奖:</span> <span id="nextDrawTime"></span></div>
                <div class="countdown"><span data-i18n="countdown_label">⏱ 倒计时:</span> <span class="time" id="countdownDisplay">--:--:--</span></div>
            </div>
            <div class="status-text idle" id="statusText" data-i18n="loading">加载数据...</div>
        </div>
        <div class="data-section">
            <div class="data-tabs">
                <button class="tab-btn active" data-tab="history" data-i18n="history">📋 开奖记录</button>
                <button class="tab-btn" data-tab="stats" data-i18n="stats">📊 号码/生肖频率</button>
            </div>
            <div class="data-panel active" id="panel-history">
                <div class="filter-bar">
                    <span class="filter-label" data-i18n="position">📍 位置:</span>
                    <div class="filter-group" id="positionFilter">
                        <button class="filter-btn active" data-pos="all" data-i18n="all">全部</button>
                        <button class="filter-btn" data-pos="0" data-i18n="position_1">第1位</button>
                        <button class="filter-btn" data-pos="1" data-i18n="position_2">第2位</button>
                        <button class="filter-btn" data-pos="2" data-i18n="position_3">第3位</button>
                        <button class="filter-btn" data-pos="3" data-i18n="position_4">第4位</button>
                        <button class="filter-btn" data-pos="4" data-i18n="position_5">第5位</button>
                        <button class="filter-btn" data-pos="5" data-i18n="position_6">第6位</button>
                        <button class="filter-btn active-special" data-pos="6" data-i18n="position_special">⭐特别号</button>
                    </div>
                    <span class="filter-divider">|</span>
                    <span class="filter-label" data-i18n="zodiac">🐾 生肖:</span>
                    <div class="filter-group" id="zodiacFilter">
                        <button class="filter-btn active" data-zodiac="all" data-i18n="zodiac_all">全部</button>
                        <button class="filter-btn" data-zodiac="蛇" data-i18n="zodiac_snake">蛇</button>
                        <button class="filter-btn" data-zodiac="龙" data-i18n="zodiac_dragon">龙</button>
                        <button class="filter-btn" data-zodiac="猫" data-i18n="zodiac_cat">猫</button>
                        <button class="filter-btn" data-zodiac="虎" data-i18n="zodiac_tiger">虎</button>
                        <button class="filter-btn" data-zodiac="牛" data-i18n="zodiac_ox">牛</button>
                        <button class="filter-btn" data-zodiac="鼠" data-i18n="zodiac_rat">鼠</button>
                        <button class="filter-btn" data-zodiac="猪" data-i18n="zodiac_pig">猪</button>
                        <button class="filter-btn" data-zodiac="狗" data-i18n="zodiac_dog">狗</button>
                        <button class="filter-btn" data-zodiac="鸡" data-i18n="zodiac_rooster">鸡</button>
                        <button class="filter-btn" data-zodiac="猴" data-i18n="zodiac_monkey">猴</button>
                        <button class="filter-btn" data-zodiac="羊" data-i18n="zodiac_goat">羊</button>
                        <button class="filter-btn" data-zodiac="马" data-i18n="zodiac_horse">马</button>
                    </div>
                </div>
                <div id="historyList"><span class="empty-history" data-i18n="history_empty">暂无记录</span></div>
            </div>
            <div class="data-panel" id="panel-stats">
                <div class="stats-toolbar">
                    <span class="stats-label" data-i18n="stats_time_range">📅 时间范围:</span>
                    <button class="btn-sm active" data-range="all" data-i18n="stats_all">全部</button>
                    <button class="btn-sm" data-range="week" data-i18n="stats_week">本周</button>
                    <button class="btn-sm" data-range="month" data-i18n="stats_month">本月</button>
                    <button class="btn-sm" data-range="year" data-i18n="stats_year">本年</button>
                    <span style="color:#667a88;font-size:0.7rem;margin-left:auto;" id="statsInfo" data-i18n="stats_periods">共 0 期</span>
                </div>
                <div class="stats-grid-wrapper">
                    <div class="stats-grid" id="statsGrid"><span class="empty-stats" data-i18n="stats_empty">暂无数据</span></div>
                    <div class="zodiac-stats" id="zodiacStats">
                        <div class="zodiac-title" data-i18n="zodiac_stats_title">🐾 生肖频率</div>
                        <div class="zodiac-grid" id="zodiacStatsGrid"><span class="empty-stats" data-i18n="stats_empty">暂无数据</span></div>
                    </div>

function createStaticBall(num, index) {
    const wrapper = document.createElement('div');
    wrapper.className = 'ball-wrapper';
    const isSpecial = (index === 6);
    const ball = document.createElement('div');
    const color = getColor(num);
    ball.className = `ball color-${color}${isSpecial ? ' special' : ''}`;
    ball.textContent = num;
    wrapper.appendChild(ball);
    const label = document.createElement('div');
    label.className = `zodiac-label${isSpecial ? ' special' : ''}`;
    label.textContent = isSpecial ? I18n.t('special') : getZodiacDisplay(num);
    wrapper.appendChild(label);
    return wrapper;
}

function setWaitingState() {
    mainContainer.innerHTML = '';
    for (let i = 0; i < 7; i++) {
        mainContainer.appendChild(createWaitingBall(i));
    }
}

function renderCurrentDraw(main, animate = false) {
    mainContainer.innerHTML = '';
    if (!main || main.length === 0) {
        setWaitingState();
        return;
    }
    if (animate) {
        for (let i = 0; i < 7; i++) {
            mainContainer.appendChild(createWaitingBall(i));
        }
        const wrappers = mainContainer.querySelectorAll('.ball-wrapper');
        main.forEach((num, idx) => {
            setTimeout(() => {
                const wrapper = wrappers[idx];
                const newWrapper = createStaticBall(num, idx);
                wrapper.parentNode.replaceChild(newWrapper, wrapper);
                const ball = newWrapper.querySelector('.ball');
                if (ball) {
                    ball.classList.add('reveal');
                    setTimeout(() => ball.classList.remove('reveal'), 600);
                }
            }, idx * 400);
        });
    } else {
        main.forEach((num, idx) => {
            mainContainer.appendChild(createStaticBall(num, idx));
        });
    }
}

async function startRollingAnimation(main) {
    return new Promise((resolve) => {
        // ★ 检测苹果设备
        const isApple = /iPhone|iPad|iPod/.test(navigator.userAgent);
        const PER_BALL_MS = 6000;
        
        mainContainer.innerHTML = '';
        for (let i = 0; i < 7; i++) {
            mainContainer.appendChild(createWaitingBall(i));
        }

        statusText.textContent = I18n.t('draw_rolling');
        statusText.className = 'status-text';

        const wrappers = mainContainer.querySelectorAll('.ball-wrapper');

        main.forEach((finalNum, idx) => {
            setTimeout(() => {
                const wrapper = wrappers[idx];
                const ball = wrapper.querySelector('.ball');
                const label = wrapper.querySelector('.zodiac-label');
                const isSpecial = (idx === 6);

                if (isSpecial) {
                    statusText.textContent = I18n.t('draw_rolling_special');
                } else {
                    statusText.textContent = I18n.t('draw_rolling_main', { idx: idx + 1 });
                }

                let rollInterval = setInterval(() => {
                    const randomNum = Math.floor(Math.random() * 49) + 1;
                    ball.textContent = randomNum;
                    
                    // ★ 苹果设备不加 CSS 动画类，其他设备加
                    if (isApple) {
                        ball.className = `ball${isSpecial ? ' special' : ''}`;
                        // 快速闪烁模拟滚动
                        ball.style.opacity = Math.random() > 0.5 ? '0.5' : '1';
                    } else {
                        ball.className = `ball rolling${isSpecial ? ' special' : ''}`;
                    }
                    
                    label.textContent = '?';
                    label.className = `zodiac-label empty${isSpecial ? ' special' : ''}`;
                }, isApple ? 80 : 50);  // 苹果设备切换稍慢一点

                setTimeout(() => {
                    clearInterval(rollInterval);
                    
                    // ★ 恢复透明度
                    ball.style.opacity = '1';

                    const color = getColor(finalNum);
                    ball.className = `ball color-${color}${isSpecial ? ' special' : ''}`;
                    ball.textContent = finalNum;

                    const displayName = isSpecial ? I18n.t('special') : getZodiacDisplay(finalNum);
                    label.className = `zodiac-label${isSpecial ? ' special' : ''}`;
                    label.textContent = displayName;

                    ball.classList.add('stopped');
                    setTimeout(() => {
                        ball.classList.remove('stopped');
                    }, 300);

                    if (isSpecial) {
                        statusText.textContent = I18n.t('draw_reveal_special');
                        setTimeout(() => {
                            I18n.updateAll();
                            statusText.textContent = I18n.t('draw_done', { period: String(window._period).padStart(3, '0') });
                            statusText.className = 'status-text';
                            loadHistory();
                            loadFrequency();
                        }, 500);
                    } else {
                        statusText.textContent = I18n.t('draw_reveal_main', { idx: idx + 1 });
                    }
                }, PER_BALL_MS);

                // ★ 苹果设备不用高亮闪烁，直接忽略
                if (!isApple) {
                    const highlightInterval = setInterval(() => {
                        ball.classList.toggle('reveal');
                    }, 200);
                    setTimeout(() => {
                        clearInterval(highlightInterval);
                        ball.classList.remove('reveal');
                    }, PER_BALL_MS);
                }

            }, idx * PER_BALL_MS);
        });

        setTimeout(() => {
            resolve();
        }, 7 * PER_BALL_MS + 500);
    });
}

function getNextDrawTime() {
    const now = new Date();
    const [hour, minute] = drawTime.split(':').map(Number);
    const vnOffset = 7;
    const localOffset = -now.getTimezoneOffset() / 60;
    const offsetDiff = vnOffset - localOffset;
    const next = new Date(now);
    next.setHours(hour - offsetDiff, minute, 0, 0);
    if (next < now) {
        next.setDate(next.getDate() + 1);
    }
    return next;
}

function updateCountdown() {
    const now = new Date();
    // 转换为越南时间 (UTC+7)
    const vnTime = new Date(now.toLocaleString('en-US', { timeZone: 'Asia/Ho_Chi_Minh' }));
    const [hour, minute] = (window._drawTime || '20:30').split(':').map(Number);
    
    const next = new Date(vnTime);
    next.setHours(hour, minute, 0, 0);
    if (next <= vnTime) {
        next.setDate(next.getDate() + 1);
    }
    
    const diff = Math.max(0, Math.floor((next - vnTime) / 1000));
    if (diff <= 0) {
        countdownDisplay.textContent = '🎰 开奖中...';
        return;
    }
    const hours = Math.floor(diff / 3600);
    const minutes = Math.floor((diff % 3600) / 60);
    const seconds = diff % 60;
    countdownDisplay.textContent =
        `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
}

async function loadConfig() {
    try {
        const response = await fetch(`${API_BASE}/api/config/draw-time`);
        if (!response.ok) {
            window._drawTime = '20:30';
            I18n.updateNextDrawTime();
            return;
        }
        const result = await response.json();
        if (result.success && result.data) {
            window._drawTime = result.data.drawTime || '20:30';
            I18n.updateNextDrawTime();
        }
    } catch (e) {
        window._drawTime = '20:30';
        I18n.updateNextDrawTime();
    }
}

async function loadCurrentDraw() {
    try {
        const response = await fetch(`${API_BASE}/api/draw/current`);
        const result = await response.json();
        if (result.success && result.data) {
            const data = result.data;
            window._currentMain = data.numbers || [];
            window._period = data.period || 0;
            renderCurrentDraw(window._currentMain);
            I18n.updateAll();
            if (window._currentMain.length > 0) {
                statusText.textContent = I18n.t('current_draw', { period: String(window._period).padStart(3, '0') });
                statusText.className = 'status-text';
            } else {
                setWaitingState();
                statusText.textContent = I18n.t('waiting_draw');
                statusText.className = 'status-text idle';
            }
            return true;
        } else {
            I18n.updateAll();
            setWaitingState();
            statusText.textContent = I18n.t('waiting_draw');
            statusText.className = 'status-text idle';
            return false;
        }
    } catch (e) {
        console.error('加载开奖失败:', e);
        I18n.updateAll();
        setWaitingState();
        statusText.textContent = I18n.t('connecting_server');
        statusText.className = 'status-text idle';
        return false;
    }
}

async function loadHistory() {
    try {
        const response = await fetch(`${API_BASE}/api/draw/history?limit=50`);

            history = result.data.records || [];
            renderHistory();
        }
    } catch (e) {
        console.error('加载历史失败:', e);
    }
}

async function loadFrequency() {
    try {
        const response = await fetch(`${API_BASE}/api/draw/frequency`);
        const result = await response.json();
        if (result.success && result.data) {
            const freq = {};
            result.data.numbers.forEach(item => {
                freq[item.number] = item.count;
            });
            frequency = freq;
            renderStats();
        }
    } catch (e) {
        console.error('加载频率失败:', e);
    }
}

function renderHistory() {
    historyList.innerHTML = '';
    if (history.length === 0) {
        historyList.innerHTML = `<span class="empty-history">${I18n.t('history_empty')}</span>`;
        return;
    }
    const years = {};
    history.forEach(item => {
        const year = item.drawTime ? new Date(item.drawTime).getFullYear() : I18n.t('unknown_year');
        const key = String(year);
        if (!years[key]) years[key] = [];
        years[key].push(item);
    });
    const sortedYears = Object.keys(years).sort((a, b) => {
        if (a === I18n.t('unknown_year')) return 1;
        if (b === I18n.t('unknown_year')) return -1;
        return parseInt(b) - parseInt(a);
    });
    sortedYears.forEach(year => {
        const yearGroup = document.createElement('div');
        yearGroup.className = 'year-group';
        const header = document.createElement('div');
        header.className = 'year-header';
        const isOpen = expandedYears.has(year);
        header.innerHTML = `
            <span class="year-label">📅 ${year}</span>
            <span class="year-count">${years[year].length} ${I18n.t('period')}</span>
            <span class="year-arrow ${isOpen ? 'open' : ''}">▶</span>
        `;
        header.addEventListener('click', function() {
            if (expandedYears.has(year)) {
                expandedYears.delete(year);
            } else {
                expandedYears.add(year);
            }
            renderHistory();
        });
        yearGroup.appendChild(header);
        const records = document.createElement('div');
        records.className = `year-records${isOpen ? ' open' : ''}`;
        years[year].forEach(item => {
            const div = document.createElement('div');
            div.className = 'history-item';
            const shouldHighlight = checkHighlight(item);
            if (!shouldHighlight) div.classList.add('dimmed');
            const timeDiv = document.createElement('div');
            timeDiv.className = 'period-time';
            const drawTimeStr = item.drawTime ? new Date(item.drawTime).toLocaleString('zh-CN') : '--';
            timeDiv.textContent = `${I18n.t('history_period', { period: String(item.period).padStart(3, '0') })} ${I18n.t('history_time')}：${drawTimeStr}`;
            div.appendChild(timeDiv);
            const ballsRow = document.createElement('div');
            ballsRow.className = 'balls-row';
            item.numbers.forEach((num, idx) => {
                const unit = document.createElement('div');
                unit.className = 'ball-unit';
                const isSpecial = (idx === 6);
                const ball = document.createElement('div');
                const color = getColor(num);
                ball.className = `h-ball h-${color}${isSpecial ? ' h-special' : ''}`;
                ball.textContent = num;
                const posActive = activePositions.includes('all') || activePositions.includes(String(idx));
                const zodiacKey = getZodiacKey(num);
                const zodiacActive = activeZodiacs.includes('all') || (zodiacKey && activeZodiacs.includes(zodiacKey));
                if (!shouldHighlight || !posActive || !zodiacActive) {
                    ball.classList.add('dimmed');
                } else {
                    ball.classList.add('highlight');
                }
                unit.appendChild(ball);
                const zLabel = document.createElement('div');
                zLabel.className = `z-under-ball${isSpecial ? ' z-special' : ''}`;
                zLabel.textContent = getZodiacDisplay(num);
                if (!zodiacActive && shouldHighlight) {
                    zLabel.classList.add('dimmed');
                } else if (zodiacActive && shouldHighlight) {
                    zLabel.classList.add('highlight');
                }
                unit.appendChild(zLabel);
                ballsRow.appendChild(unit);
            });
            div.appendChild(ballsRow);
            records.appendChild(div);
        });
        yearGroup.appendChild(records);
        historyList.appendChild(yearGroup);
    });
}

function checkHighlight(item) {
    if (activePositions.includes('all') && activeZodiacs.includes('all')) return true;
    let posMatch = activePositions.includes('all');
    if (!posMatch) {
        for (let i = 0; i < item.numbers.length; i++) {
            if (activePositions.includes(String(i))) { posMatch = true; break; }
        }
    }
    let zodiacMatch = activeZodiacs.includes('all');
    if (!zodiacMatch) {
        for (const num of item.numbers) {
            const key = getZodiacKey(num);
            if (key && activeZodiacs.includes(key)) { zodiacMatch = true; break; }
        }
    }
    return posMatch && zodiacMatch;
}

function renderStats() {
    const range = currentRange;
    let filteredHistory = [];
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    if (range === 'all') {
        filteredHistory = history;
    } else if (range === 'week') {
        const weekStart = new Date(today);
        weekStart.setDate(today.getDate() - today.getDay() + 1);
        filteredHistory = history.filter(item => {
            if (!item.drawTime) return false;
            return new Date(item.drawTime) >= weekStart;
        });
    } else if (range === 'month') {
        const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
        filteredHistory = history.filter(item => {
            if (!item.drawTime) return false;
            return new Date(item.drawTime) >= monthStart;
        });
    } else if (range === 'year') {
        const yearStart = new Date(now.getFullYear(), 0, 1);
        filteredHistory = history.filter(item => {
            if (!item.drawTime) return false;
            return new Date(item.drawTime) >= yearStart;
        });
    }
    const freq = {};
    let totalDraws = 0;
    filteredHistory.forEach(item => {
        totalDraws++;
        item.numbers.forEach(n => { freq[n] = (freq[n] || 0) + 1; });
    });
    totalDrawsEl.textContent = totalDraws;
    const numsWithFreq = Object.keys(freq).length;
    coveredNumsEl.textContent = numsWithFreq;
    let maxFreq = 0, minFreq = Infinity;
    let maxNum = '-', minNum = '-';
    for (const [num, f] of Object.entries(freq)) {
        if (f > maxFreq) { maxFreq = f; maxNum = num; }
        if (f < minFreq) { minFreq = f; minNum = num; }
    }
    if (maxFreq === 0) { maxFreq = 0; maxNum = '-'; }
    if (minFreq === Infinity) { minFreq = 0; minNum = '-'; }
    hottestNumEl.textContent = maxNum;
    hottestFreqEl.textContent = maxFreq;
    coldestNumEl.textContent = minNum;
    coldestFreqEl.textContent = minFreq;
    document.getElementById('statsInfo').textContent = I18n.t('stats_periods', { count: totalDraws });
    statsGrid.innerHTML = '';
    let hasData = false;
    const maxFreqForBar = maxFreq > 0 ? maxFreq : 1;
    for (let i = 1; i <= 49; i++) {
        const f = freq[i] || 0;
        if (f > 0) hasData = true;
        const item = document.createElement('div');
        const color = getColor(i);
        const dotClass = color === 'red' ? 'red-dot' : color === 'blue' ? 'blue-dot' : 'green-dot';
        const barClass = color === 'red' ? 'red-bar' : color === 'blue' ? 'blue-bar' : 'green-bar';
        const barWidth = f > 0 ? Math.max(10, (f / maxFreqForBar) * 80) : 0;
        item.className = `stat-item ${dotClass}`;
        item.innerHTML = `
            <span class="stat-num">${i}</span>
            <span class="stat-freq">${f || '-'}</span>
            <div class="stat-bar ${barClass}" style="width:${Math.min(barWidth, 50)}px;"></div>
        `;
        statsGrid.appendChild(item);
    }
    if (!hasData) {
        statsGrid.innerHTML = `<span class="empty-stats">${I18n.t('stats_empty')}</span>`;
    }
    renderZodiacStats(filteredHistory);
}

function renderZodiacStats(filteredHistory) {
    const zodiacFreq = {};
    const zodiacKeys = ['snake','dragon','cat','tiger','ox','rat','pig','dog','rooster','monkey','goat','horse'];
    const zodiacDisplayNames = ['zodiac_snake','zodiac_dragon','zodiac_cat','zodiac_tiger','zodiac_ox','zodiac_rat','zodiac_pig','zodiac_dog','zodiac_rooster','zodiac_monkey','zodiac_goat','zodiac_horse'];
    zodiacKeys.forEach(z => { zodiacFreq[z] = 0; });
    filteredHistory.forEach(item => {
        item.numbers.forEach(num => {
            const key = getZodiacKey(num);
            if (key && zodiacFreq[key] !== undefined) {
                zodiacFreq[key]++;
            }
        });
    });
    zodiacStatsGrid.innerHTML = '';
    let hasZodiacData = false;
    const maxZodiacFreq = Math.max(...Object.values(zodiacFreq), 1);
    zodiacKeys.forEach((key, idx) => {
        const count = zodiacFreq[key] || 0;
        if (count > 0) hasZodiacData = true;
        const item = document.createElement('div');
        item.className = 'zodiac-item';
        const barWidth = count > 0 ? Math.max(10, (count / maxZodiacFreq) * 100) : 0;
        const displayName = I18n.t(zodiacDisplayNames[idx]);
        item.innerHTML = `
            <span class="z-name">${displayName}</span>
            <div class="z-bar-wrap"><div class="z-bar" style="width:${Math.min(barWidth, 100)}%;"></div></div>
            <span class="z-count">${count}</span>
        `;
        zodiacStatsGrid.appendChild(item);
    });
    if (!hasZodiacData) {
        zodiacStatsGrid.innerHTML = `<span class="empty-stats">${I18n.t('stats_empty')}</span>`;
    }
}

function initFilters() {
    document.querySelectorAll('#positionFilter .filter-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            const pos = this.dataset.pos;
            if (pos === 'all') {
                activePositions = ['all'];
                document.querySelectorAll('#positionFilter .filter-btn').forEach(b => b.classList.remove('active', 'active-special'));
                this.classList.add('active');
            } else {
                activePositions = activePositions.filter(p => p !== 'all');
                document.querySelector('#positionFilter .filter-btn[data-pos="all"]').classList.remove('active');
                const idx = activePositions.indexOf(pos);
                if (idx >= 0) {
                    activePositions.splice(idx, 1);
                    this.classList.remove('active', 'active-special');
                } else {
                    activePositions.push(pos);
                    this.classList.add(pos === '6' ? 'active-special' : 'active');
                }
                if (activePositions.length === 0) {
                    activePositions = ['all'];
                    document.querySelector('#positionFilter .filter-btn[data-pos="all"]').classList.add('active');
                }
            }
            renderHistory();
        });
    });
    const zodiacKeyMap = {
        '蛇':'snake','龙':'dragon','猫':'cat','虎':'tiger',
        '牛':'ox','鼠':'rat','猪':'pig','狗':'dog',
        '鸡':'rooster','猴':'monkey','羊':'goat','马':'horse'
    };
    document.querySelectorAll('#zodiacFilter .filter-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            const zodiacLabel = this.dataset.zodiac;
            if (zodiacLabel === 'all') {
                activeZodiacs = ['all'];
                document.querySelectorAll('#zodiacFilter .filter-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
            } else {
                const zodiacKey = zodiacKeyMap[zodiacLabel] || zodiacLabel;
                activeZodiacs = activeZodiacs.filter(z => z !== 'all');
                document.querySelector('#zodiacFilter .filter-btn[data-zodiac="all"]').classList.remove('active');
                const idx = activeZodiacs.indexOf(zodiacKey);
                if (idx >= 0) {
                    activeZodiacs.splice(idx, 1);
                    this.classList.remove('active');
                } else {
                    activeZodiacs.push(zodiacKey);
                    this.classList.add('active');
                }
                if (activeZodiacs.length === 0) {
                    activeZodiacs = ['all'];
                    document.querySelector('#zodiacFilter .filter-btn[data-zodiac="all"]').classList.add('active');
                }
            }
            renderHistory();
        });
    });
    document.querySelectorAll('#panel-stats .btn-sm[data-range]').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('#panel-stats .btn-sm[data-range]').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            currentRange = this.dataset.range;
            renderStats();
        });
    });
}

function initTabs() {
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            document.querySelectorAll('.data-panel').forEach(p => p.classList.remove('active'));
            document.getElementById('panel-' + this.dataset.tab).classList.add('active');
        });
    });
}

let pollingInterval = null;

function startSmartPolling() {
    if (pollingInterval) {
        clearInterval(pollingInterval);
        pollingInterval = null;
    }
    function checkAndPoll() {
        const now = new Date();
        const [hour, minute] = drawTime.split(':').map(Number);
        let drawDate = new Date(now);
        drawDate.setHours(hour, minute, 0, 0);
        if (drawDate < now) drawDate.setDate(drawDate.getDate() + 1);
        const diffSeconds = (drawDate - now) / 1000;
        if (diffSeconds <= 120 && diffSeconds > -10) {
            if (!pollingInterval) {
                pollingInterval = setInterval(async () => {
                    try {
                        const response = await fetch(`${API_BASE}/api/draw/current`);
                        const result = await response.json();
                        if (result.success && result.data) {
                            const data = result.data;
                            if (data.period > window._period && data.numbers && data.numbers.length > 0) {
                                window._period = data.period;
                                window._currentMain = data.numbers;
                                await startRollingAnimation(data.numbers);
                                await loadHistory();
                                await loadFrequency();
                                I18n.updateAll();
                                statusText.textContent = I18n.t('draw_done', { period: String(window._period).padStart(3, '0') });
                                statusText.className = 'status-text';
                                if (pollingInterval) {
                                    clearInterval(pollingInterval);
                                    pollingInterval = null;
                                }
                            }
                        }
                    } catch (e) {}
                }, 3000);
            }
        } else if (diffSeconds > 120) {
            if (pollingInterval) {
                clearInterval(pollingInterval);
                pollingInterval = null;
            }
        }
    }
    checkAndPoll();
    setInterval(checkAndPoll, 10000);
}

let ws = null;
function connectWebSocket() {
    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const wsUrl = `wss://api.vnlotto.vip/ws`;
    if (ws && ws.readyState === WebSocket.OPEN) return;
    ws = new WebSocket(wsUrl);
    ws.onopen = function() { console.log('🔗 WebSocket 已连接'); };
    ws.onmessage = function(event) {
        try {
            const data = JSON.parse(event.data);
            if (data.event === 'draw_start') {
                if (!isAnimating) {
                    isAnimating = true;
                    startRollingAnimation(data.numbers);
                }
            } else if (data.event === 'draw_complete') {
                isAnimating = false;
                window._period = data.period;
                window._currentMain = data.numbers;
                renderCurrentDraw(data.numbers, false);
                I18n.updateAll();
                loadHistory();
                loadFrequency();
                statusText.textContent = I18n.t('draw_done', { period: String(window._period).padStart(3, '0') });
                statusText.className = 'status-text';
            } else if (data.type === 'current') {
                if (data.data.period > window._period && data.data.numbers.length > 0) {
                    window._period = data.data.period;
                    window._currentMain = data.data.numbers;
                    renderCurrentDraw(data.data.numbers, false);
                    I18n.updateAll();
                    loadHistory();
                    loadFrequency();
                }
            } else if (data.type === 'ping') {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ type: 'pong' }));
                }
            }
        } catch (e) { console.error('解析消息失败:', e); }
    };
    ws.onclose = function() {
        console.log('🔌 WebSocket 断开，3秒后重连...');
        setTimeout(connectWebSocket, 3000);
    };
    ws.onerror = function(error) { console.error('WebSocket 错误:', error); };
}

// ============================================================
//  初始化
// ============================================================
async function init() {
    window._period = 0;
    window._currentMain = [];
    window._drawTime = '20:30';
    
    I18n.init('zh');
    
    await loadConfig();
    await loadCurrentDraw();
    await loadHistory();
    await loadFrequency();

    updateCountdown();
    countdownInterval = setInterval(updateCountdown, 1000);

    connectWebSocket();
    startSmartPolling();

    setInterval(async () => { await loadFrequency(); }, 30000);
    setInterval(async () => { await loadHistory(); }, 60000);

    initFilters();
    initTabs();

    document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            const lang = this.getAttribute('data-lang');
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            I18n.setLocale(lang);
            renderCurrentDraw(window._currentMain, false);
            loadHistory();
            loadFrequency();
        });
    });
}

init();
